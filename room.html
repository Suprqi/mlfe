<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ملفّي · لوحة المؤسس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8; --paper:#FBF8F1; --paper-2:#F2EDE1;
  --ink:#1B2A28; --ink-soft:#43534F; --ink-dim:#8A9793;
  --teal:#0E5A52; --teal-deep:#0A423C; --teal-light:#E3EEEB;
  --gold:#C9A24B; --gold-soft:#F0E4C6;
  --line:#E0D8C7; --line-soft:#EBE4D6;
  --danger:#B84A3B; --danger-soft:#F6E3DF;
  --purple:#7A4E94; --purple-soft:#EFE7F4;
  --shadow:0 10px 40px -12px rgba(14,90,82,.22); --shadow-sm:0 3px 14px -6px rgba(14,90,82,.25);
  --r:14px; --r-sm:9px;
  --disp:'Reem Kufi',sans-serif; --body:'IBM Plex Sans Arabic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding-bottom:44px}
h1,h2,h3,h4,.disp{font-family:var(--disp);font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── الهيكل: شريط جانبي يمين (RTL) ── */
.shell{display:flex;min-height:100vh;align-items:stretch}
aside{width:232px;flex:none;background:var(--paper);border-inline-start:1px solid var(--line);
  padding:16px 12px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.seal{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--teal),var(--teal-deep));
  display:grid;place-items:center;font-family:var(--disp);font-size:19px;color:var(--gold);font-weight:700;flex:none;box-shadow:var(--shadow-sm)}
.brand b{font-family:var(--disp);font-size:17px;display:block;line-height:1.15}
.brand span{font-size:10px;color:var(--ink-dim);letter-spacing:.18em}
nav.side{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);font-size:13.5px;
  color:var(--ink-soft);font-family:var(--disp);text-align:start;width:100%}
.nv .ic{width:17px;text-align:center;font-size:14px;opacity:.75;flex:none}
.nv:hover{background:var(--paper-2);color:var(--ink)}
.nv[aria-current="true"]{background:var(--teal);color:#fff}
.nv[aria-current="true"] .ic{opacity:1}
.nv[disabled]{opacity:.32;cursor:not-allowed}
.nv .cnt{margin-inline-start:auto;font-size:10.5px;background:var(--gold-soft);color:#7A5D22;border-radius:99px;padding:1px 7px;font-family:var(--body)}
.nv[aria-current="true"] .cnt{background:rgba(255,255,255,.22);color:#fff}
.side-sep{border-top:1px solid var(--line-soft);margin:6px 4px}
.dqcard{margin-top:auto;background:var(--teal-light);border:1px solid rgba(14,90,82,.16);border-radius:var(--r);padding:13px}
.dqcard .h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft)}
.dqcard b{font-family:var(--disp);font-size:26px;display:block;line-height:1.2;margin-top:2px}
.dqspark{display:flex;gap:2px;align-items:flex-end;height:22px;margin:8px 0}
.dqspark i{flex:1;background:var(--teal);opacity:.45;border-radius:1px}
.whoami{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);padding:9px 10px}
.whoami .av{width:32px;height:32px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;
  font-family:var(--disp);color:#7A5D22;flex:none;font-size:14px}
.whoami select{border:0;background:none;font-family:inherit;font-size:11px;color:var(--ink-dim);padding:0;width:100%}
.whoami b{font-size:12.5px;display:block;line-height:1.2}

.content{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;overflow-x:hidden}
.shell{max-width:100vw}
section,.card,.strip,.ask,.att{max-width:100%;min-width:0}
/* الجداول تُمرَّر داخل بطاقتها بدل أن تدفع الصفحة */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
.tblwrap::-webkit-scrollbar{height:4px}
.tblwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
pre{max-width:100%}
.tophd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:22px 22px 0}
.tophd .greet{margin-inline-start:auto;text-align:end}
.tophd h1{font-size:22px;line-height:1.3}
.tophd .greet p{margin:1px 0 0;font-size:12.5px;color:var(--ink-dim)}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;
  font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
.chipbtn:hover{border-color:var(--teal);color:var(--teal)}
main{padding:16px 22px 26px;flex:1}
.statusbar{position:sticky;bottom:0;background:rgba(251,248,241,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);z-index:30}
.statusbar .sitem{display:flex;align-items:center;gap:6px}
.statusbar .sp{margin-inline-start:auto}
.view{display:none;animation:fade .26s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{margin-bottom:26px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0 0 9px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}

/* ask bar */
.ask{background:linear-gradient(140deg,var(--teal),var(--teal-deep));border-radius:var(--r);padding:16px;color:#fff;box-shadow:var(--shadow)}
.ask h2{font-size:17px;color:var(--gold-soft)}
.ask p.sub{margin:2px 0 12px;font-size:12px;color:rgba(255,255,255,.62)}
.ask-in{display:flex;gap:8px;flex-wrap:wrap}
.ask-in input{flex:1;min-width:200px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:var(--r-sm);padding:11px 13px;font-family:inherit;font-size:13.5px}
.ask-in input::placeholder{color:rgba(255,255,255,.5)}
.ask-in button{background:var(--gold);color:var(--teal-deep);border-radius:var(--r-sm);padding:11px 18px;font-weight:600;font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.85);
  border-radius:99px;padding:5px 11px;font-size:11.5px}
.chip:hover{background:rgba(255,255,255,.2)}
.answer{margin-top:12px;background:rgba(0,0,0,.16);border-radius:var(--r-sm);padding:13px;font-size:13px;line-height:1.75;display:none}
.answer.on{display:block}
.answer b{color:var(--gold-soft)}
.answer .acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.ablk{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ablk:last-of-type{border:0}
.alab{display:block;font-size:10px;letter-spacing:.14em;color:var(--gold);margin-bottom:4px}
.ablk ul{margin:0;padding-inline-start:16px}
.ablk li{margin-bottom:3px;color:rgba(255,255,255,.8);font-size:12.5px}
.answer .acts button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 12px;font-size:11.5px}

/* kpi strip */
.strip{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px;box-shadow:var(--shadow-sm)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr)}
.kpi{padding:13px 12px;border-inline-start:1px solid var(--line-soft);text-align:start}
.kpi:first-child{border:0}
.kpi b{display:block;font-family:var(--disp);font-size:25px;line-height:1.2}
.kpi small{display:block;font-size:11.5px;color:var(--ink-soft)}
.kpi i{font-style:normal;font-size:11px;display:inline-block;margin-top:3px}
.up{color:var(--teal)}.down{color:var(--danger)}.flat{color:var(--ink-dim)}

/* pulse lines */
.pulse{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.pulse:last-child{border:0}
.pulse .pi{flex:none;font-size:15px;line-height:1.4}

/* decision */
.dec{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);border-inline-start:4px solid var(--gold)}
.dec.crit{border-inline-start-color:var(--danger);background:linear-gradient(90deg,var(--danger-soft),var(--paper) 60%)}
.dec.win{border-inline-start-color:var(--teal);background:linear-gradient(90deg,var(--teal-light),var(--paper) 60%)}
.dec h4{font-size:14.5px;margin-bottom:3px}
.dec p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.dec .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn-s{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 13px;font-size:12px;color:var(--teal);font-weight:500}
.btn-s:hover{background:var(--teal);color:#fff;border-color:var(--teal)}

/* stat */
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .lb{font-size:11.5px;color:var(--ink-soft);display:block}
.stat .vl{font-family:var(--disp);font-size:23px;display:block;margin-top:2px;line-height:1.25}
.stat .sub{font-size:11px;color:var(--ink-dim)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;font-size:11px;color:var(--ink-dim);font-weight:600;letter-spacing:.05em;padding:0 9px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 9px;border-bottom:1px solid var(--line-soft)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--teal-light)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:54px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.meter i.warn{background:var(--gold)}.meter i.crit{background:var(--danger)}
.tag{font-size:10.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;display:inline-block}
.tag.live{color:var(--teal);border-color:var(--teal);background:var(--teal-light)}
.tag.dead{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.tag.gold{color:#8A6E31;border-color:var(--gold);background:var(--gold-soft)}
.tag.pur{color:var(--purple);border-color:var(--purple);background:var(--purple-soft)}

/* funnel */
.fn{display:flex;flex-direction:column;gap:3px}
.fn-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.fn-row:hover{background:var(--teal-light)}
.fn-row .fl{font-size:13px}
.fn-bar{height:26px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.fn-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-deep),var(--teal));border-radius:5px}
.fn-bar b{position:absolute;inset-inline-start:9px;top:0;line-height:26px;font-size:11.5px;color:#fff;font-weight:500}
.fn-row .fd{font-size:11.5px;color:var(--danger);white-space:nowrap;min-width:56px;text-align:end}
.fn-row .fd.ok{color:var(--ink-dim)}

/* mcu gauge */
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge svg{flex:none}
.gauge .gv{font-family:var(--disp);font-size:34px;line-height:1}

/* chain */
.chain{display:flex;align-items:stretch}
.stage{flex:1;min-width:0;padding:12px 8px;border-radius:var(--r-sm);text-align:center}
.stage:hover{background:var(--teal-light)}
.stage .st-l{font-family:var(--disp);font-size:13px;margin-bottom:8px;display:block}
.bar{height:80px;border-radius:5px;background:linear-gradient(180deg,var(--teal),var(--teal-deep));display:flex;align-items:flex-end;justify-content:center}
.bar.warn{background:linear-gradient(180deg,var(--gold),#8A6E31)}
.bar.crit{background:linear-gradient(180deg,var(--danger),#8C3A2C)}
.bar span{font-size:11px;color:#fff;padding-bottom:5px}
.stage .st-c{font-family:var(--disp);font-size:18px;display:block;margin-top:7px}
.stage .st-p{font-size:10.5px;color:var(--ink-dim)}
.drop{align-self:center;width:46px;flex:none;text-align:center;font-size:10px;color:var(--danger)}
.drop b{display:block;font-size:12px}
.drop.ok{color:var(--ink-dim)}

/* health */
.hs{display:inline-flex;align-items:center;gap:7px}
.hs .hd-n{font-family:var(--disp);font-size:15px}
.ring{width:34px;height:34px;flex:none}

/* ops */
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12.5px;background:var(--paper)}
.led{width:8px;height:8px;border-radius:50%;flex:none}
.led.g{background:var(--teal)}.led.o{background:var(--gold)}.led.r{background:var(--danger);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

/* flags */
.flag{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.flag:last-child{border:0}
.flag .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:11px}
.seg button{padding:5px 10px;color:var(--ink-soft);border-inline-end:1px solid var(--line-soft);white-space:nowrap}
.seg button:last-child{border:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}

/* decision inbox */
.dq{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dq button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:11.5px;color:var(--ink-soft)}
.dq button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);margin-bottom:10px}
.dcard .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dcard h4{font-size:14.5px}
.dcard .did{font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em}
.stt{font-size:10.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid}
.stt.s0{color:var(--ink-soft);border-color:var(--line);background:var(--paper-2)}
.stt.s1{color:#8A6E31;border-color:var(--gold);background:var(--gold-soft)}
.stt.s2{color:var(--purple);border-color:var(--purple);background:var(--purple-soft)}
.stt.s3{color:var(--teal);border-color:var(--teal);background:var(--teal-light)}
.stt.s4{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.flow{display:flex;align-items:center;gap:0;margin:12px 0 4px;flex-wrap:wrap}
.flow span{font-size:10.5px;color:var(--ink-dim);padding:3px 8px;border-radius:99px;white-space:nowrap}
.flow span.on{background:var(--teal);color:#fff}
.flow span.done{color:var(--teal)}
.flow i{color:var(--line);font-style:normal;font-size:10px}
.mbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;background:var(--paper-2);border-radius:var(--r-sm);flex-wrap:wrap}
.mbar b{font-family:var(--disp);font-size:15px}
.verdict{font-size:12.5px;padding:10px;border-radius:var(--r-sm);margin-top:9px;line-height:1.6}
.verdict.ok{background:var(--teal-light);color:var(--teal)}
.verdict.no{background:var(--danger-soft);color:var(--danger)}
/* weekly review */
.wk{background:linear-gradient(140deg,var(--teal),var(--teal-deep));border-radius:var(--r);padding:16px;color:#fff;box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.wk h3{color:var(--gold-soft);font-size:16px}
.wk p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.66)}
.wk button{background:var(--gold);color:var(--teal-deep);border-radius:99px;padding:9px 18px;font-weight:600;font-size:13px}
.wkm{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.wkm:last-child{border:0}
.wkm b{font-family:var(--disp);font-size:15px}
/* attention cards */
.att{border:1px solid var(--line);border-radius:var(--r);padding:15px;background:var(--paper);display:flex;flex-direction:column;gap:2px}
.att.crit{background:linear-gradient(160deg,var(--danger-soft),var(--paper) 70%);border-color:rgba(184,74,59,.3)}
.att.win{background:linear-gradient(160deg,var(--teal-light),var(--paper) 70%);border-color:rgba(14,90,82,.22)}
.att.watch{background:linear-gradient(160deg,var(--gold-soft),var(--paper) 70%);border-color:rgba(201,162,75,.42)}
.att-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.att-e{font-size:11px;font-weight:600}
.att.crit .att-e{color:var(--danger)}.att.win .att-e{color:var(--teal)}.att.watch .att-e{color:#8A6E31}
.att-i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.att.crit .att-i{background:var(--danger)}.att.win .att-i{background:var(--teal)}.att.watch .att-i{background:var(--gold)}
.att h3{font-size:16px;margin:5px 0 0}
.att-n b{font-family:var(--disp);font-size:27px}
.att p{margin:1px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.55;flex:1}
.att-b{margin-top:11px;border:1px solid;border-radius:var(--r-sm);padding:8px;font-size:12.5px;width:100%;background:var(--paper)}
.att.crit .att-b{color:var(--danger);border-color:rgba(184,74,59,.4)}
.att.crit .att-b:hover{background:var(--danger);color:#fff}
.att.win .att-b{color:var(--teal);border-color:rgba(14,90,82,.35)}
.att.win .att-b:hover{background:var(--teal);color:#fff}
.att.watch .att-b{color:#8A6E31;border-color:var(--gold)}
.att.watch .att-b:hover{background:var(--gold);color:#fff}
/* card head */
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.cardh b{font-family:var(--disp);font-size:14.5px}
/* proportional funnel */
.fmnwrap{display:flex;flex-direction:column;gap:6px}
.fmn{position:relative;padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;overflow:hidden;background:var(--paper-2)}
.fmn:hover .fmn-bar{opacity:.34}
.fmn-bar{position:absolute;inset-block:0;inset-inline-start:0;background:var(--teal);opacity:.22;border-radius:var(--r-sm);transition:opacity .2s}
.fmn-lb{position:relative;font-size:12.5px}
.fmn-vl{position:relative;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-top:1px}
.fmn-vl b{font-family:var(--disp);font-size:16px}
.fmn-vl span{font-size:10.5px;color:var(--ink-soft)}
/* legend */
.lgnd{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ink-soft)}
.lgnd span{display:flex;align-items:center;gap:5px}
.lgnd i{width:13px;height:2.5px;border-radius:2px;display:block}
/* mini decisions */
.dmini{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.dmini:hover b{color:var(--teal)}
.dmini b{font-size:12.5px;display:block;line-height:1.4}
/* mcu row */
.mcuwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mrow{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12px}
.mrow span:first-child{width:78px}
.mrow .meter{flex:1}
.mrow span:last-child{width:34px;text-align:end;color:var(--ink-soft)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.srow:last-child{border:0}
/* ask header */
.ask-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.ask-tag{font-size:10.5px;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;color:rgba(255,255,255,.75);white-space:nowrap}
/* trust layer */
.trust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0 10px;font-size:11.5px;color:var(--ink-soft)}
.trust .tq{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 11px}
.trust .tq b{font-family:var(--disp);font-size:12.5px}
.trust .tsep{color:var(--line)}
.trust button{color:var(--teal);font-size:11.5px;text-decoration:underline;text-underline-offset:3px}
.demobar{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r-sm);
  padding:9px 13px;font-size:12.5px;color:#7A5D22;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.blocked{max-width:560px;margin:60px auto;text-align:center}
.warnbadge{font-size:10px;color:var(--danger);border:1px solid var(--danger);background:var(--danger-soft);
  border-radius:99px;padding:1px 7px;margin-inline-start:6px;white-space:nowrap}
/* evidence grade */
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:var(--r-sm);overflow:hidden;margin-top:4px}
.grade div{background:rgba(0,0,0,.22);padding:8px 10px}
.grade span{display:block;font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:2px}
.grade b{font-size:12px;font-weight:500}
.causal{margin-top:10px;border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;line-height:1.6}
.causal.corr{background:rgba(224,112,94,.18);border:1px solid rgba(224,112,94,.4);color:#F6C9C0}
.causal.exp{background:rgba(61,156,141,.16);border:1px solid rgba(61,156,141,.4);color:#BFE6DD}
@media(max-width:640px){.grade{grid-template-columns:repeat(2,1fr)}}
.masked{color:var(--ink-dim);font-size:12px;background:repeating-linear-gradient(45deg,var(--line-soft),var(--line-soft) 4px,transparent 4px,transparent 8px);padding:2px 9px;border-radius:5px}
.locked{text-align:center;padding:46px 20px;color:var(--ink-soft)}
.locked .lk{font-size:28px;display:block;margin-bottom:10px;color:var(--ink-dim)}
input.fld,select.fld{width:100%;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:13.5px}
.spark{width:100%;height:48px;display:block}
.note{font-size:11.5px;color:var(--ink-dim);line-height:1.65}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:15px 0}

.ov{position:fixed;inset:0;background:rgba(27,42,40,.44);backdrop-filter:blur(4px);z-index:90;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:780px;max-height:88vh;overflow:auto;padding:18px 16px 34px}
.sheet h3{font-size:18px;margin-bottom:3px}
.sheet .cl{position:sticky;top:0;float:left;font-size:19px;color:var(--ink-dim);padding:0 4px}
pre{background:var(--teal-deep);border-radius:var(--r-sm);padding:13px;overflow:auto;font-size:11.5px;line-height:1.7;
  direction:ltr;text-align:left;color:#CFE3DE;font-family:ui-monospace,Menlo,monospace}
.audit-e{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.audit-e time{color:var(--ink-dim);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ═══ shape() — الجسر بين أسماء الـViews ومفاتيح الواجهة ═══
   كانت مُستدعاة وغير معرَّفة: أي تشغيل في وضع الإنتاج ينهار بـ
   ReferenceError قبل عرض أي رقم. */
const VIEW_MAP={
  mv_overview:'head',            mv_funnel:'funnel',         mv_chain:'chain',
  mv_retention:'retention',      mv_cohorts:'cohorts',       mv_features:'features',
  mv_mcu_segments:'mcuSeg',      mv_economy:'economy',       mv_ai:'ai',
  mv_ops:'ops',                  mv_voice:'voice',           mv_users:'users',
  mv_data_quality:'quality',     mv_acquisition:'acquisition',

  mv_award_overview:'award_overview', mv_award_results:'award_results',

};
/* Views تُرجع صفًا واحدًا — تُفكّ من المصفوفة */
const SINGLE_ROW=['mv_overview','mv_retention','mv_economy','mv_ai','mv_ops','mv_data_quality','mv_award_overview'];

function shape(out){
  const db={};
  for(const [view,key] of Object.entries(VIEW_MAP)){
    const rows=out[view];
    if(rows===undefined) continue;
    db[key]=SINGLE_ROW.includes(view) ? (rows[0]??null) : rows;
  }
  /* مفاتيح تحسبها الواجهة ولا يقابلها View — تبقى فارغة بدل أن تنهار */
  ['pulse','activeSeries','curve','weekly'].forEach(k=>{ if(db[k]===undefined) db[k]=[]; });
  const missing=Object.values(VIEW_MAP).filter(k=>db[k]===undefined);
  if(missing.length) throw new Error('نواقص في البيانات: '+missing.join('، ')+' — راجع «الأحداث والتوصيل».');
  return db;
}

      if(error) throw new Error(`تعذّرت قراءة ${v}: ${error.message}`);
      out[v]=data;
    }
    return shape(out);   // shape() يطابق مخرجات الـViews بأسماء الحقول التي تستخدمها الواجهة
  }
};

function spark(v,c='#0E5A52'){
  const w=300,h=48,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const p=v.map((x,i)=>[i/(v.length-1)*w,h-5-((x-mn)/rg)*(h-12)]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="${c}" opacity=".1"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${p.at(-1)[0]}" cy="${p.at(-1)[1]}" r="3.4" fill="${c}"/></svg>`;
}
function ring(v,size=34){
  const r=(size-5)/2,c=2*Math.PI*r,col=v>=80?'#0E5A52':v>=60?'#3D8B7E':v>=40?'#C9A24B':'#B84A3B';
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E0D8C7" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

const HS_W={act:['النشاط',25],ret:['العودة',25],prod:['إنتاج الوثائق',20],conn:['ترابط الميزات',20],port:['ملف الأداء',10]};

/* ما الذي يرفع صحته؟ يُشتق من أضعف مكوّن ومن أول خطوة ناقصة في السلسلة */
function hsUplift(u){
  const miss=CHAIN.find(c=>!u.journey.includes(c.key));
  const gaps=Object.entries(u.hsc).map(([k,v])=>({k,gap:HS_W[k][1]-v})).sort((a,b)=>b.gap-a.gap);
  if(!miss) return{txt:'أكمل السلسلة كاملة. رفع صحته الآن يأتي من التكرار لا من خطوة جديدة.',to:hsOf(u)};
  const next=CHAIN[CHAIN.indexOf(miss)+1];
  const gain=Math.min(gaps[0].gap,8)+Math.min(gaps[1].gap,6)+(next?3:0);
  return{
    txt:`إذا أنشأ «${miss.label}»${next?` وربطه بـ«${next.label}»`:''}، يرتفع المتوقع إلى <b>${ar(Math.min(100,hsOf(u)+gain))}</b> — الزيادة تأتي من ${HS_W[gaps[0].k][0]} و${HS_W[gaps[1].k][0]}.`,
    to:Math.min(100,hsOf(u)+gain)};
}

function askRun(i){
  const a=ASK[i].f(); audit('سؤال مساعد المؤسس',ASK[i].q);
  const box=$('ans');
  const cf=a.cf[0], cfc=cf==='عالية'?'#9FD8B4':cf==='متوسطة'?'#F0D89A':'#F3B3A6';
  const g=a.g, weak=DB.quality.score<95;
  const corr=g&&(g.k==='ارتباط'||g.k==='تقدير نموذجي');
  box.innerHTML=`
    ${a.ev.length?`<div class="ablk"><span class="alab">الدليل</span><ul>${a.ev.map(e=>`<li>${e}</li>`).join('')}</ul></div>`:''}
    ${g?`<div class="ablk"><span class="alab">درجة الدليل</span>
      <div class="grade">
        <div><span>حجم العيّنة</span><b>${g.n}</b></div>
        <div><span>الفترة</span><b>${g.p}</b></div>
        <div><span>المقارنة</span><b>${g.cmp}</b></div>
        <div><span>نوع العلاقة</span><b style="color:${corr?'#F3B3A6':'#9FD8B4'}">${g.k}</b></div>
      </div></div>`:''}
    <div class="ablk"><span class="alab">الاستنتاج</span><div>${a.c}</div></div>
    ${a.cf[1]?`<div class="ablk"><span class="alab">الثقة</span><div><b style="color:${cfc}">${cf}</b> — ${a.cf[1]}
      <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:4px">الثقة هنا حكم على قوة الدليل، لا نسبة محسوبة — لذلك لا تُعطى رقمًا.</div></div></div>`:''}
    ${corr?`<div class="causal corr"><b>ارتباط لا سببية.</b> ${g.k==='ارتباط'
        ?'الشرائح هنا اختارت نفسها بنفسها، فلا يجوز أن يُبنى عليها تطوير مباشرة.'
        :'هذا تقدير من نموذج حسابي لا قياس فعلي.'}
      ${a.exp?`<div style="margin-top:7px">${a.exp}</div>`:''}
      <div class="acts" style="margin-top:9px"><button onclick="toExperiment(${i})">حوّلها إلى تجربة في صندوق القرارات</button></div></div>`
      :g?`<div class="causal exp"><b>${g.k==='مدعوم بتجربة'?'مدعوم بتجربة سابقة مقاسة.':'قراءة وصفية مباشرة.'}</b> يصلح للبناء عليه دون تجربة إضافية.</div>`:''}
    ${a.a&&!corr?`<div class="ablk"><span class="alab">الإجراء المقترح</span><div>${a.a}</div></div>`:''}
    ${weak?`<div class="causal corr" style="margin-top:10px"><b>جودة البيانات ${pct(DB.quality.score)}.</b> التوصيات الكبيرة موقوفة حتى تعود فوق ٩٥٪.</div>`:''}
    <div class="acts">${a.acts.map(([l,t])=>t==='weekly'
      ?`<button onclick="openSheet('weekly')">${l} ←</button>`
      :`<button onclick="go('${t}')">${l} ←</button>`).join('')}</div>`;
  box.classList.add('on');
}
/* تحويل استنتاج ارتباطي إلى تجربة لها خط أساس وهدف — لا إلى مهمة تطوير */
function toExperiment(i){
  const a=ASK[i].f(), id='D-0'+(20+DB.decisions.length);
  DB.decisions.unshift({
    id, title:'تجربة: '+ASK[i].q.replace('؟',''),
    problem:a.exp||'استنتاج ارتباطي يحتاج إثباتًا قبل البناء عليه.',
    metric:'يُحدَّد عند تصميم التجربة',unit:'',baseline:0,target:1,current:null,
    state:'قيد التحقيق',owner:'—',opened:'اليوم',rollout:null,
    evidence:`${a.g.n} · ${a.g.p} · ${a.g.cmp} · ${a.g.k}`,
    check:'لا يُغلق قبل مجموعة مقارنة عشوائية',result:null});
  audit('تحويل استنتاج إلى تجربة',id+' — '+ASK[i].q);
  go('command'); renderInbox();
}
function askFree(){
  const v=$('askq').value.trim();
  if(!v) return;
  const hit=ASK.findIndex(a=>a.q.split(' ').filter(w=>w.length>3).some(w=>v.includes(w)));
  const box=$('ans');
  if(hit>-1) return askRun(hit);
  audit('سؤال غير مفهوم للمساعد',v);
  box.innerHTML=`<div>لا أملك قاعدة محسوبة لهذا السؤال بعد. المساعد في هذه النسخة يجيب من قواعد مبنية على بيانات اللوحة، لا من نموذج لغوي.
    الأسئلة المدعومة الآن معروضة كأزرار بالأعلى. كل إجابة تلتزم بالترتيب نفسه: الدليل ← الاستنتاج ← مستوى الثقة ← الإجراء.</div>`;
  box.classList.add('on');
}

const STATES=['جديد','قيد التحقيق','تم القرار','قيد التنفيذ','قياس النتيجة','مغلق'];
const sttClass=s=>['s0','s1','s2','s2','s3','s4'][STATES.indexOf(s)]||'s0';
let DFILTER='مفتوح';
function renderInbox(){
  const box=$('dinbox'); if(!box) return;
  const list=DB.decisions.filter(d=>DFILTER==='الكل'?true:DFILTER==='مفتوح'?d.state!=='مغلق':d.state===DFILTER);
  const counts=['مفتوح','قياس النتيجة','مغلق','الكل'];
  box.innerHTML=`<div class="dq">${counts.map(c=>`<button aria-pressed="${DFILTER===c}" onclick="setDFilter('${c}')">${c}
    <span class="num">${ar(c==='الكل'?DB.decisions.length:c==='مفتوح'?DB.decisions.filter(d=>d.state!=='مغلق').length:DB.decisions.filter(d=>d.state===c).length)}</span></button>`).join('')}</div>
  ${list.length?list.map(d=>dCard(d)).join(''):'<p class="note">لا قرارات في هذا التصنيف.</p>'}`;
}
const setDFilter=f=>{DFILTER=f;renderInbox();};
/* لا يجوز أن تحمل حالةٌ ما قبل «قياس النتيجة» رقمَ نتيجة. التناقض يُعرض لا يُخفى. */
function stateConflict(d){
  const si=STATES.indexOf(d.state);
  if(d.current!=null && si<STATES.indexOf('قياس النتيجة'))
    return `الحالة «${d.state}» لا تتّسق مع وجود قياس. انقله إلى «قياس النتيجة» أو احذف الرقم.`;
  if(d.state==='مغلق' && d.current==null) return 'قرار مغلق بلا قياس — لا يجوز.';
  return null;
}
function dCard(d){
  const si=STATES.indexOf(d.state), closed=d.state==='مغلق', conflict=stateConflict(d);
  const moved=d.current!=null?d.current-d.baseline:null;
  const need=d.target-d.baseline;
  const prog=moved!=null?Math.max(0,Math.min(100,moved/need*100)):0;
  const verdict=closed&&d.result?`<div class="verdict ${d.result.startsWith('نجح')?'ok':'no'}">${d.result}</div>`:'';
  return `<div class="dcard">
    <div class="dh"><div><span class="did num">${d.id}</span><h4>${d.title}</h4></div>
      <span class="stt ${sttClass(d.state)}">${d.state}</span></div>
    <p class="note" style="margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)">${d.problem}</p>
    <div class="flow">${STATES.map((s,i)=>
      `<span class="${i===si?'on':i<si?'done':''}">${s}</span>${i<STATES.length-1?'<i>←</i>':''}`).join('')}</div>
    <div class="mbar">
      <span class="note" style="min-width:96px">${d.metric}</span>
      <b class="num">${ar(d.baseline)}${d.unit}</b>
      <span class="note">←</span>
      <b class="num" style="color:${moved==null?'var(--ink-dim)':moved*Math.sign(need)>0?'var(--teal)':'var(--danger)'}">${d.current==null?'—':ar(d.current)+d.unit}</b>
      <span class="note">الهدف ${ar(d.target)}${d.unit}</span>
      <div class="meter" style="flex:1;min-width:80px"><i class="${prog<40?'warn':''}" style="width:${prog}%"></i></div>
    </div>
    ${conflict?`<div class="verdict no">⚠︎ ${conflict}</div>`:''}
    ${verdict}
    <div class="acts" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${!closed?`<button class="btn-s" onclick="advance('${d.id}')">انقله إلى «${STATES[si+1]}»</button>`:''}
      <button class="btn-s" onclick="openSheet('dec','${d.id}')">التفاصيل والدليل</button>
      <span class="note">${d.owner!=='—'?'المسؤول '+d.owner+' · ':''}${d.rollout!=null?'مطروح لـ'+ar(d.rollout)+'٪ · ':''}${d.check}</span>
    </div></div>`;
}
function advance(id){
  const d=DB.decisions.find(x=>x.id===id), i=STATES.indexOf(d.state);
  if(i>=STATES.length-1) return;
  d.state=STATES[i+1];
  if(d.state==='قياس النتيجة'&&d.current==null){d.current=d.baseline;d.check='بدأ القياس — النتيجة بعد ٧ أيام';}
  if(d.state==='مغلق'&&!d.result){
    const moved=(d.current??d.baseline)-d.baseline, need=d.target-d.baseline;
    const r=moved/need;
    d.result=r>=1?`نجح: بلغ الهدف (${ar(d.baseline)}${d.unit} ← ${ar(d.current)}${d.unit}).`
      :r>=.4?`نجح جزئيًا: ${ar(d.baseline)}${d.unit} ← ${ar(d.current)}${d.unit}، دون الهدف ${ar(d.target)}${d.unit}.`
      :`فشل: لم يتحرك المؤشر بما يكفي (${ar(d.baseline)}${d.unit} ← ${ar(d.current)}${d.unit}).`;
    d.check='اكتمل';
  }
  audit('نقل قرار',`${d.id} ← ${d.state}`);
  renderInbox();
}

/* ── مكوّنات بصرية ── */
function donut(v,size=132){
  const r=(size-18)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="11"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="48%" text-anchor="middle" font-family="Reem Kufi" font-size="30" fill="var(--ink)">${ar(v)}</text>
    <text x="50%" y="65%" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-size="10.5" fill="var(--ink-dim)">من ١٠٠</text>
  </svg>`;
}
/* قِمع متناسب فعلًا: عرض كل شريحة = نسبتها من الأساس */
function funnelMini(){
  const f=DB.funnel, keys=['signup','profile','firstdoc','sub'];
  const rows=keys.map(k=>f.find(x=>x.k===k));
  return rows.map((r,i)=>{
    const ofBase=r.n/rows[0].n*100, prev=i?rows[i-1].n:null;
    return `<div class="fmn" onclick="openSheet('stage',${f.indexOf(r)})">
      <div class="fmn-bar" style="width:${ofBase}%"></div>
      <div class="fmn-lb">${r.l}</div>

        <span class="num">${pct(ofBase)} من الإجمالي</span>
        ${prev?`<span class="num" style="color:var(--ink-dim)">${pct(r.n/prev*100)} من السابقة</span>`:''}</div>
    </div>`}).join('');
}
/* منحنى الأفواج D1→D90 */
function cohortChart(){
  const c=DB.curve, W=340,H=150,PX=26,PY=14;
  const xs=v=>PX+(Math.log10(v)-0)/Math.log10(90)*(W-PX-6);
  const ys=v=>PY+(1-v/100)*(H-PY-20);
  const path=a=>a.map((v,i)=>(i?'L':'M')+xs(c.x[i]).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  const marks=[1,7,30,60,90];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" aria-label="منحنى الاحتفاظ">
    ${[0,50,100].map(g=>`<line x1="${PX}" x2="${W-6}" y1="${ys(g)}" y2="${ys(g)}" stroke="var(--line-soft)"/>
      <text x="${PX-4}" y="${ys(g)+3}" text-anchor="end" font-size="8.5" fill="var(--ink-dim)">${ar(g)}٪</text>`).join('')}
    ${marks.map(m=>`<text x="${xs(m)}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="var(--ink-dim)">D${ar(m)}</text>`).join('')}
    <path d="${path(c.base)}" fill="none" stroke="var(--ink-dim)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="${path(c.all)}"  fill="none" stroke="var(--ink)" stroke-width="2.2"/>
    <path d="${path(c.paid)}" fill="none" stroke="var(--teal)" stroke-width="2.2"/>
  </svg>
  <div class="lgnd">
    <span><i style="background:var(--ink)"></i>كل المستخدمين</span>
    <span><i style="background:var(--teal)"></i>المدفوعون</span>
    <span><i style="background:var(--ink-dim)"></i>خط الأساس</span>
  </div>`;
}

export async function track(name, meta = {}) {
  try {
    await supabase.from('events').insert({
      user_id: (await supabase.auth.getUser()).data.user?.id ?? null,
      name, meta, session_id: SESSION_ID, platform: isMobile() ? 'mobile' : 'web'
    });

}

const SQL=`-- ١ · الأحداث: الأساس. بدونه كل رقم في اللوحة صفر.
create table events (
  id bigserial primary key,
  user_id uuid references auth.users(id) on delete cascade,
  name text not null, meta jsonb default '{}',
  session_id text, platform text,
  created_at timestamptz default now()
);
create index on events (name, created_at desc);
create index on events (user_id, created_at desc);

-- ٢ · سجل التدقيق: لا يُعدَّل ولا يُحذف من التطبيق
create table audit_log (
  id bigserial primary key, actor_id uuid not null,
  actor_role text not null, action text not null,
  target text, created_at timestamptz default now()
);
revoke update, delete on audit_log from authenticated, anon;

-- ٣ · الطرح التدريجي
create table feature_flags (
  key text primary key, rollout_pct int default 100,
  updated_at timestamptz default now(), updated_by uuid
);

-- ٤ · القرارات وقياس نتائجها: هنا تُقفل الحلقة
create table decisions (
  id text primary key, title text not null, problem text,
  metric_key text not null,            -- يطابق مفتاحًا في قاموس المؤشرات
  baseline numeric not null, target numeric not null,
  state text not null default 'جديد',  -- جديد → قيد التحقيق → تم القرار → قيد التنفيذ → قياس النتيجة → مغلق
  owner_id uuid, flag_key text, rollout_pct int,
  opened_at timestamptz default now(), measure_after interval default '7 days',
  closed_at timestamptz, result text
);
create table decision_measurements (
  decision_id text references decisions(id),
  measured_at timestamptz default now(),
  value numeric not null, cohort text
);
-- القرار لا يُغلق إلا بقياس واحد على الأقل بعد measure_after

-- ٥ · درجة الصحة: تُحسب ليليًا لا عند كل فتح للوحة
create materialized view user_health as
select u.id as user_id,
  least(100, round(
      40 * least(1.0, active_days_30 / 12.0)      -- العودة
    + 30 * least(1.0, distinct_features / 4.0)    -- اتساع الاستخدام
    + 20 * least(1.0, docs_completed / 10.0)      -- الإنتاج
    + 10 * portfolio_completion                   -- اكتمال ملف الأداء
  )) as health_score
from user_rollup u;`;

function renderTabs(){

function go(id){

/* ═══ ♛ الجائزة والتحكيم ═══════════════════════════════════════
   الاكتمال ≠ الجودة. هذا التبويب يعرض الاكتمال والحالة والفرز،
   ولا يرتّب فائزًا — الترتيب من درجات لجنة بشرية.               */
const AW_STATES=[
  ['eligible',    'مؤهل',          'var(--teal)'],
  ['needs_review','يحتاج مراجعة',  'var(--gold)'],
  ['ineligible',  'غير مؤهل',      'var(--danger)'],
  ['judging',     'قيد التحكيم',   'var(--teal)'],
  ['judged',      'مكتمل التحكيم', 'var(--teal)']
];
let AW_FILTER='all';
function awSetFilter(f){AW_FILTER=f;document.getElementById('v-award').innerHTML=vAward();}
function awPlace(place){
  const o=DB.award_overview||{};
  if(!String(o.tie_break_rule||'').trim()){
    alert('معيار الحسم غير معلَن في هذه الدورة.\nاكتبه في award_cycles.tie_break_rule قبل اعتماد أي مركز — المعيار يُعلَن قبل ظهور النتائج لا بعده.');
    return;
  }
  const judged=(DB.award_results||[]).filter(r=>r.status==='judged');
  if(!judged.length){alert('لا ملفات مكتملة التحكيم بعد.');return}
  const ref=prompt('مرجع الملف للمركز '+place+'؟\nالمرشحون: '+judged.map(r=>r.ref).join(' · '));
  if(!ref)return;
  const r=judged.find(x=>x.ref===ref.trim());
  if(!r){alert('مرجع غير موجود أو لم يكتمل تحكيمه.');return}
  const why=prompt('سبب اعتماد '+r.ref+' للمركز '+place+'؟ (يُسجَّل ولا يُحذف)');
  if(!why||why.trim().length<5){alert('السبب إلزامي — لم يُعتمد شيء.');return}
  audit('اعتماد المركز '+place+' لـ'+r.ref+' — '+why.trim());
  if(MODE==='demo'){alert('وضع تجريبي: لم يُعتمد مركز.\nفي الإنتاج تُستدعى award_resolve().');return}
  alert('تُستدعى award_resolve() على الخادم.');
}
function awStateLabel(s){
  const x=AW_STATES.find(a=>a[0]===s);
  return x?`<span style="color:${x[2]};font-weight:600">${x[1]}</span>`:'<span class="note">—</span>';
}
/* الاسم لا يُعرض في القائمة. كشفه فعل مقصود بسبب مكتوب، ويُقيَّد في award_reveals.
   الحياد يُثبَت بالأثر لا بالنيّة. */
function awReveal(ref){
  const why=prompt('سبب كشف هوية صاحب الملف '+ref+'؟ (يُسجَّل باسمك ولا يُحذف)');
  if(!why||why.trim().length<5){alert('سبب الكشف إلزامي — لم يُكشف شيء.');return}
  audit('كشف هوية '+ref+' — '+why.trim());
  if(MODE==='demo'){alert('وضع تجريبي: لا هوية حقيقية تُكشف.\nفي الإنتاج يُستدعى award_reveal() ويُقيَّد الكشف.');return}
  alert('يُستدعى award_reveal() من الخادم — لا تُقرأ الهوية في المتصفح.');
}

/* ═══ شاشة المحكّم — بطاقة التحكيم ═══════════════════════════
   يرى المرجع والاكتمال والإحصاءات. لا اسم ولا مدرسة ولا جوال.
   والاكتمال معروض للعلم لا للترجيح: هو معيار من خمسة بوزنه المعلن. */
let AWJ_OPEN=null;
const AWJ_DRAFT={};

function awjOpen(ref){AWJ_OPEN=(AWJ_OPEN===ref?null:ref);document.getElementById('v-award').innerHTML=vAward();}
function awjSet(ref,cid,val){
  AWJ_DRAFT[ref]=AWJ_DRAFT[ref]||{};
  AWJ_DRAFT[ref][cid]=val===''?null:Math.max(0,Number(val));
  const t=document.getElementById('awj-total-'+ref);
  if(t)t.textContent=ar(awjTotal(ref));
}
/* وزن المعيار هو درجته القصوى (٢٥ = من ٢٥)، فالمجموع جمعٌ لا متوسط موزون.
   ضربها في الوزن ثانيةً يعطي رقمًا لا معنى له. */
function awjTotal(ref){
  const cr=DB.award_criteria||[], d=AWJ_DRAFT[ref]||{};
  let sum=0;
  cr.forEach(c=>{ if(d[c.id]!=null) sum+=d[c.id]; });
  return Math.round(sum*10)/10;
}
function awjSave(ref){
  const cr=DB.award_criteria||[], d=AWJ_DRAFT[ref]||{};
  const missing=cr.filter(c=>d[c.id]==null);
  if(missing.length){alert('أكمل درجات كل المعايير — ناقص: '+missing.map(c=>c.label).join('، '));return}
  const over=cr.filter(c=>d[c.id]>c.weight);
  if(over.length){alert('درجة تتجاوز وزن المعيار: '+over.map(c=>c.label).join('، '));return}
  audit('حفظ تحكيم '+ref+' — المجموع '+awjTotal(ref));
  if(MODE==='demo'){alert('وضع تجريبي: لم تُحفظ درجة.\nفي الإنتاج تُكتب في award_scores، وتنتقل حالة الملف تلقائيًا.');return}
  alert('تُرسل إلى award_scores عبر الخادم.');
}

function vAwardJudge(){
  const q=DB.judging_queue||[], cr=DB.award_criteria||[];
  if(!cr.length) return `<div class="card locked"><span class="lk">◍</span>
    <b class="disp">بطاقة التحكيم غير معدّة</b>
    <p class="note" style="margin:6px 0 0">تحدّد الإدارة المعايير وأوزانها في <code>award_criteria</code> قبل بدء التحكيم.</p></div>`;

  const done=q.filter(x=>x.scored_criteria>=x.total_criteria).length;
  return `
  <section>
    <p class="eyebrow">التحكيم</p>
    <div class="card">
      <div class="kpis">
        <div class="kpi"><b class="num">${ar(q.length)}</b><small>ملفات مسندة إليك</small></div>
        <div class="kpi"><b class="num">${ar(done)}</b><small>أنجزتها</small></div>
        <div class="kpi"><b class="num">${ar(q.length-done)}</b><small>متبقية</small></div>
      </div>
      <p class="note" style="margin-top:10px">لا تُعرض أسماء المشاركين. التحكيم بالمرجع وحده.</p>
    </div>
  </section>

  <section>
    <p class="eyebrow">بطاقة التحكيم — ${ar(cr.reduce((a,c)=>a+c.weight,0))} درجة</p>
    <div class="card"><table class="t"><thead><tr><th>المعيار</th><th>الوزن</th></tr></thead><tbody>
      ${cr.map(c=>`<tr><td>${c.label}</td><td class="num">${ar(c.weight)}</td></tr>`).join('')}
    </tbody></table></div>
  </section>

  <section>
    <p class="eyebrow">ملفاتك</p>
    ${q.length?q.map(x=>{
      const open=AWJ_OPEN===x.ref, fin=x.scored_criteria>=x.total_criteria;
      return `<div class="card" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <b class="disp" style="flex:1;min-width:0">${x.ref}</b>
          ${fin?'<span style="color:var(--teal);font-weight:600">✓ مُحكَّم</span>':''}
          <button class="chip" onclick="awjOpen('${x.ref}')">${open?'إغلاق':'فتح البطاقة'}</button>
        </div>
        <p class="note" style="margin:8px 0 0">
          اكتمال ${ar(x.completeness)}٪ · ${ar((x.stats&&x.stats.evidence)||0)} شاهدًا ·
          ${ar((x.stats&&x.stats.workPairs)||0)} نموذج قبل/بعد · ${ar(x.image_count)} صورة
          ${x.suspects_count?` · <span style="color:var(--danger)">${ar(x.suspects_count)} اسمًا مشتبهًا</span>`:''}
        </p>
        ${open?`
        <div style="margin-top:12px;border-top:1px solid var(--line,#DCD2BF);padding-top:12px">
          ${cr.map(c=>`
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
              <span style="flex:1;min-width:0;font-size:14px">${c.label}</span>
              <input type="number" min="0" max="${c.weight}" step="0.5" inputmode="decimal"
                     style="width:76px;text-align:center;padding:6px;border:1px solid var(--line,#DCD2BF);border-radius:8px"
                     oninput="awjSet('${x.ref}',${c.id},this.value)">
              <span class="note" style="flex:none">/ ${ar(c.weight)}</span>
            </div>`).join('')}
          <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
            <b style="flex:1">المجموع الموزون: <span id="awj-total-${x.ref}" class="num">٠</span></b>
            <button class="chip on" onclick="awjSave('${x.ref}')">حفظ التحكيم</button>
          </div>
          <p class="note" style="margin-top:10px">لا يُحفظ إلا بعد تعبئة كل المعايير. ودرجتك وحدها — النتيجة النهائية متوسط موزون لكل المحكّمين.</p>
        </div>`:''}
      </div>`;
    }).join(''):'<div class="card"><p class="note">لا ملفات مسندة إليك بعد.</p></div>'}
  </section>`;
}

function renderAll(){
  const V={command:vCommand,decisions:vDecisions,users:vUsers,journey:vJourney,product:vProduct,economy:vEconomy,ai:vAI,voice:vVoice,award:vAward};
  for(const[id,fn]of Object.entries(V)){
    const el=document.getElementById('v-'+id);
    if(!ROLES[ROLE].tabs.includes(id)){ el.innerHTML=lock(); continue; }
    try{ el.innerHTML=fn(); }
    catch(err){
      el.innerHTML=`<div class="card locked"><span class="lk">◍</span>
        <b class="disp">تعذّر عرض هذا القسم</b>
        <p class="note" style="margin:6px 0 0">${err.message}</p>
        <p class="note">بقية الأقسام تعمل. أبلغ عن هذا مع لقطة الشاشة.</p></div>`;
    }
  }
  if(ROLES[ROLE].tabs.includes('users')) filterUsers('');
  if(ROLES[ROLE].tabs.includes('decisions')) renderInbox();
  renderTabs();
  go(ROLES[ROLE].tabs.includes(CURRENT)?CURRENT:ROLES[ROLE].tabs[0]);
}
$('role').onchange=e=>{ROLE=e.target.value;audit('تبديل الدور',ROLES[ROLE].label);renderAll();};
(async function init(){
  try{ DB=await Source.all(); }
  catch(e){
    document.querySelector('main').innerHTML=`<div class="card blocked"><span class="lk" style="font-size:30px">◍</span>
      <h3 style="margin:10px 0 6px">اللوحة موقوفة</h3>
      <p class="note">${e.message}</p>
      <p class="note" style="margin-top:10px">لا تُعرض بيانات تجريبية بديلة عن بيانات الإنتاج. راجع «الأحداث والتوصيل».</p></div>`;
    return;
  }
  try{
    const now=new Date(), hr=now.getHours();
    $('greet').innerHTML=
      `${hr<12?'صباح الخير':'مساء الخير'}، عبدالله <span style="font-family:var(--body)">👋</span>`;
    $('today-date').textContent=fmtDate(now);
  }catch(_){ $('today-date').textContent='اليوم'; }
  audit('دخول لوحة المؤسس');
  try{ renderTrust(); }catch(e){ console.warn('trust',e); }
  try{ renderAll(); }
  catch(e){
    document.querySelector('main').innerHTML=`<div class="card locked"><span class="lk">◍</span>
      <b class="disp">تعذّر رسم اللوحة</b><p class="note" style="margin:6px 0 0">${e.message}</p></div>`;
  }
})();
</script>
</body>
